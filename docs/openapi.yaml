openapi: 3.0.3
info:
  title: Portfolio Manager API — częściowy kontrakt
  version: 0.2.0
  description: |
    Częściowy kontrakt, nie katalog wszystkich dostępnych tras. Obejmuje bezpośredni import XTB,
    mapowanie symboli, wybrane operacje kredytów, podsumowanie analiz oraz odczyt ustawień
    i kontekstu AI. Budżet, sesje importu, płatności i generowanie AI nie mają tutaj pełnych
    schematów. Zakres i referencje: docs/API_ZAKRES_PL.md. Obiekty analityczne dopuszczają
    dodatkowe pola; ich szczegóły opisują dokumenty domenowe i klienci frontendu.
servers:
  - url: /api
components:
  schemas:
    AiSettings:
      type: object
      required: [model, daily_budget_usd, input_usd_per_million, output_usd_per_million, max_output_tokens, version, used_usd, configured, budget_day, price_note]
      properties:
        model: {type: string}
        daily_budget_usd: {type: number}
        input_usd_per_million: {type: number}
        output_usd_per_million: {type: number}
        max_output_tokens: {type: integer}
        version: {type: integer}
        used_usd: {type: number}
        configured: {type: boolean, description: Czy backend ma ustawiony klucz; nie potwierdza jego ważności u dostawcy.}
        budget_day: {type: string, format: date, description: Dzień UTC.}
        price_note: {type: string}
    AnalysisContext:
      type: object
      description: Stan wejściowy; szczegółowe pola modeli wyceny i wyników opisuje referencja analiz.
      required: [portfolio_id, name, account_type, include_subportfolios, created_at, start, end, value, positions, results, warnings, sources]
      properties:
        portfolio_id: {type: integer}
        name: {type: string}
        account_type: {type: string}
        include_subportfolios: {type: boolean}
        created_at: {type: string, format: date-time}
        start: {type: string, format: date}
        end: {type: string, format: date}
        value: {type: object, additionalProperties: true}
        positions:
          type: array
          items: {type: object, additionalProperties: true}
        results: {type: object, additionalProperties: true}
        warnings:
          type: array
          items: {type: string}
        sources:
          type: array
          items:
            type: object
            required: [id, label, href, data]
            properties:
              id: {type: string}
              label: {type: string}
              href: {type: string}
              data: {}
      additionalProperties: true
    ApiSuccessEnvelope:
      type: object
      required: [payload]
      properties:
        payload: {}
    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            code:
              type: string
            details:
              type: object
              additionalProperties: true
    SymbolMapping:
      type: object
      required: [id, symbol_input, ticker, created_at]
      properties:
        id:
          type: integer
        symbol_input:
          type: string
        ticker:
          type: string
        currency:
          type: string
          nullable: true
          enum: [PLN, USD, EUR, GBP, null]
        created_at:
          type: string
          nullable: true
    SymbolMappingDeleteResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    XtbImportSuccess:
      type: object
      required: [success, message, missing_symbols]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        missing_symbols:
          type: array
          items:
            type: string
    XtbImportErrorDetails:
      type: object
      properties:
        missing_symbols:
          type: array
          items:
            type: string
    LoanMutationResult:
      type: object
      required: [message]
      properties:
        id:
          type: integer
        message:
          type: string
    LoanSchedule:
      type: object
      required: [loan, baseline, simulation, actual_metrics, simulated_metrics, overpayments_list]
      properties:
        loan:
          type: object
          additionalProperties: true
        baseline:
          type: object
          additionalProperties: true
        simulation:
          type: object
          additionalProperties: true
        actual_metrics:
          type: object
          additionalProperties: true
        simulated_metrics:
          type: object
          additionalProperties: true
        overpayments_list:
          type: array
          items:
            type: object
            additionalProperties: true
paths:
  /portfolio/{portfolio_id}/import/xtb:
    post:
      summary: Bezpośredni import XTB CSV lub XLSX Cash Operations
      parameters:
        - in: path
          name: portfolio_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/XtbImportSuccess'
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          details:
                            $ref: '#/components/schemas/XtbImportErrorDetails'
  /symbol-map:
    get:
      summary: List symbol mappings
      responses:
        '200':
          description: Symbol mappings list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        type: array
                        items:
                          $ref: '#/components/schemas/SymbolMapping'
    post:
      summary: Create symbol mapping
      responses:
        '201':
          description: Created symbol mapping
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/SymbolMapping'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: Mapping already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /symbol-map/{mapping_id}:
    put:
      summary: Update symbol mapping
      parameters:
        - in: path
          name: mapping_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated symbol mapping
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/SymbolMapping'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
    delete:
      summary: Delete symbol mapping
      parameters:
        - in: path
          name: mapping_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Mapping deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/SymbolMappingDeleteResult'
        '404':
          description: Mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /loans/:
    get:
      summary: List loans
      responses:
        '200':
          description: Loans list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
    post:
      summary: Create loan
      responses:
        '201':
          description: Loan created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/LoanMutationResult'
        '400':
          description: Missing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /loans/{loan_id}/schedule:
    get:
      summary: Get loan schedule
      parameters:
        - in: path
          name: loan_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Loan schedule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/LoanSchedule'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /analytics/summary:
    get:
      summary: Zbiorcza analiza bieżącego koszyka akcyjnego
      description: Zakres, jednostki i ograniczenia opisuje docs/ANALYTICS_SUMMARY_API_PL.md.
      parameters:
        - in: query
          name: portfolio_id
          required: true
          schema: {type: integer, minimum: 1}
        - in: query
          name: sub_portfolio_id
          schema: {type: integer, minimum: 1}
        - in: query
          name: period
          schema: {type: string, enum: [3mo, 6mo, 3m, 6m, 1y, 2y], default: 1y}
      responses:
        '200':
          description: Koperta payload; szczegóły metryk i aliasy są w referencji domenowej.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        type: object
                        required: [portfolio_id, sub_portfolio_id, period, cached, performance, risk, correlation, diversification]
                        properties:
                          portfolio_id: {type: integer}
                          sub_portfolio_id: {type: integer, nullable: true}
                          period: {type: string, enum: [3mo, 6mo, 1y, 2y]}
                          cached: {type: boolean}
                          performance: {type: object, additionalProperties: true}
                          risk: {type: object, additionalProperties: true}
                          correlation: {type: object, additionalProperties: true}
                          diversification: {type: object, additionalProperties: true}
                        additionalProperties: true
        '400':
          description: Niepoprawne parametry lub zakres.
        '404':
          description: Nieistniejący portfel.
        '500':
          description: Nie udało się przygotować analizy.
  /ai/settings:
    get:
      summary: Ustawienia i szacowane wykorzystanie dziennego limitu AI
      description: Odczyt lokalny; nie wywołuje generowania ani nie zwraca klucza.
      responses:
        '200':
          description: Ustawienia w kopercie payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/AiSettings'
  /ai/context/{pid}:
    get:
      summary: Stan danych portfela do analizy
      description: Bez generowania AI i odświeżania notowań. Pozycje są bieżące; from/to wyznaczają okres wyników.
      parameters:
        - in: path
          name: pid
          required: true
          schema: {type: integer}
        - in: query
          name: include_subportfolios
          schema: {type: string, enum: ['0', '1'], default: '1'}
        - in: query
          name: from
          description: Domyślnie pierwszy dzień bieżącego miesiąca.
          schema: {type: string, format: date}
        - in: query
          name: to
          description: Domyślnie dzisiaj; data nie może być przyszła ani wcześniejsza niż from.
          schema: {type: string, format: date}
      responses:
        '200':
          description: Kontekst z ostrzeżeniami i źródłami w kopercie payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/AnalysisContext'
        '400':
          description: Niepoprawny zakres, daty lub portfel archiwalny.
        '404':
          description: Nieistniejący portfel.
